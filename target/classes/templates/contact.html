<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Valkyrias Agency</title>
    <!-- Use Tailwind CSS CDN for visual style styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-8">
        <h2 class="text-3xl font-extrabold text-amber-500 mb-2">Get in Touch</h2>
        <p class="text-slate-400 mb-6 text-sm">Send us a message and we will get back to you shortly.</p>

        <!-- Display success alert if submission was successful -->
        <div th:if="${success}" class="mb-6 p-4 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm">
            ✓ Your message has been sent and saved successfully!
        </div>

        <!-- Form bound to the ContactMessage model attribute -->
        <form th:action="@{/contact}" th:object="${contactMessage}" method="POST" class="space-y-4">
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Name</label>
                <input type="text" id="name" th:field="*{name}" required 
                       class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-white placeholder-slate-500 outline-none transition" 
                       placeholder="John Doe">
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="email" th:field="*{email}" required 
                       class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-white placeholder-slate-500 outline-none transition" 
                       placeholder="john@example.com">
            </div>

            <div>
                <label for="subject" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Subject</label>
                <input type="text" id="subject" th:field="*{subject}" required 
                       class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-white placeholder-slate-500 outline-none transition" 
                       placeholder="Project Collaboration">
            </div>

            <div>
                <label for="message" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Message</label>
                <textarea id="message" th:field="*{message}" rows="4" required 
                          class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-white placeholder-slate-500 outline-none transition" 
                          placeholder="Tell us about your project..."></textarea>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-6 rounded-lg bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold tracking-wider hover:shadow-lg hover:shadow-amber-500/20 active:scale-[0.98] transition duration-200">
                Send Message
            </button>
        </form>
    </div>
</body>
</html>
