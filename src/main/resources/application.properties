# Server Port Configuration
server.port=8080

# --- SUPABASE POSTGRESQL CONFIGURATION ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.mqikasdtpnqnzsrevunv.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_supabase_db_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Thymeleaf cache
spring.thymeleaf.cache=false
