# Server Port Configuration
server.port=8080

# --- DATABASE (Supabase PostgreSQL; fail fast when deployment config is absent) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache (disable in development mode for hot reloads)
spring.thymeleaf.cache=false

# Supabase Auth token verification. The publishable key is safe to identify the
# Supabase project, while the service-role key must remain backend-only.
supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Profile avatar storage
supabase.storage.profile-bucket=${SUPABASE_PROFILE_BUCKET:profile-avatars}
supabase.storage.max-avatar-bytes=${PROFILE_AVATAR_MAX_BYTES:5242880}
supabase.storage.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:3600}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:6MB}

# Comma-separated frontend origins. Credentials are not enabled because API
# authentication is carried explicitly in the Authorization header.
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}

# Optional local demo accounts. Disabled by default and never enabled without
# an explicitly supplied backend-only password.
app.seed-users.enabled=${APP_SEED_USERS_ENABLED:false}
app.seed-users.password=${APP_SEED_PASSWORD:}
