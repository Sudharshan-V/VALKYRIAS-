# Server Port Configuration
server.port=${PORT:8080}
spring.config.import=optional:file:.env.local[.properties]

# --- DATABASE (Supabase PostgreSQL; fail fast when deployment config is absent) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache (disable in development mode for hot reloads)
spring.thymeleaf.cache=false

# Supabase Auth token verification. SupabaseAuthClient validates the bearer
# token with /auth/v1/user using the server-side project URL and publishable
# key. No JWT signing secret or service-role key is used for normal auth.
supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Profile avatar storage
supabase.storage.profile-bucket=${SUPABASE_PROFILE_BUCKET:profile-avatars}
supabase.storage.order-files-bucket=${SUPABASE_ORDER_FILES_BUCKET:order-files}
supabase.storage.max-avatar-bytes=${PROFILE_AVATAR_MAX_BYTES:5242880}
supabase.storage.max-file-bytes=${ORDER_FILE_MAX_BYTES:104857600}
supabase.storage.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:3600}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:101MB}

# Comma-separated frontend origins. Credentials are not enabled because API
# authentication is carried explicitly in the Authorization header.
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}

# Razorpay credentials. Keep the secret server-side; only the public key id is
# returned with a checkout order.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
