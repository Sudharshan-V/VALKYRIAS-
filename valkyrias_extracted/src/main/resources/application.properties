# Server Port Configuration
server.port=8080

# --- H2 IN-MEMORY DATABASE (Active by default for instant local execution) ---
spring.datasource.url=jdbc:h2:mem:valkyrias_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- POSTGRESQL DATABASE (Uncomment to use real database) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/valkyrias_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache (disable in development mode for hot reloads)
spring.thymeleaf.cache=false
